<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Watch Video with GET</title>
</head>

<body>

  <h1>Choose a YouTube Video</h1>

  <form action="https://www.youtube.com/watch" method="get">

    <label>
      <input type="radio" name="v" value="49_Ph2q6uIM" required>
      Video 1
    </label>

    <br>

    <label>
      <input type="radio" name="v" value="s1ax8Tx_Jz0">
      Video 2
    </label>

    <br>

    <label>
      <input type="radio" name="v" value="Q8AeLp_TSBg">
      Video 3
    </label>

    <br><br>

    <button type="submit">Watch Video</button>

  </form>

</body>

</html>
