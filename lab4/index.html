<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>My First Hangman</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 40px;
    }

    #word {
      font-size: 34px;
      letter-spacing: 8px;
      margin: 30px;
    }

    button {
      margin: 4px;
      padding: 8px 12px;
    }
  </style>
</head>

<body>
  <h1>Hangman</h1>
  <p>Guess the hidden word.</p>
  <div id="word">_ _ _ _ _ _ _</div>
  <div id="letters"></div>
  <p id="message">Choose a letter.</p>
  <script>
    const word = "browser";
    let guessed = [];
    const wordBox = document.getElementById("word");
    const lettersBox = document.getElementById("letters");
    const message = document.getElementById("message");

    for (let code = 65; code <= 90; code++) {
      const letter = String.fromCharCode(code).toLowerCase();
      const button = document.createElement("button");
      button.textContent = letter.toUpperCase();
      button.onclick = function () {
        guessed.push(letter);
        wordBox.textContent = word.split("").map(c => guessed.includes(c) ? c : "_").join(" ");
        message.textContent = word.includes(letter) ? "Correct!" : "Wrong guess.";
        button.disabled = true;
      };
      lettersBox.appendChild(button);
    }
  </script>
</body>

</html>
