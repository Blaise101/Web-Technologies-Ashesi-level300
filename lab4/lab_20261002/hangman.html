<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hangman</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="game">
    <h1>Hangman</h1>
    <p class="description">Guess the hidden word one letter at a time. You have six wrong guesses before the game ends.
    </p>

    <div class="drawing-area">
      <img id="hangmanImage" src="images/hangman_stage_1.png" alt="Hangman stage 1">
    </div>

    <div class="info">
      <span>Category: <strong id="category">-</strong></span>
      <span>Mistakes: <strong id="mistakes">0 / 6</strong></span>
      <span>Score: <strong id="score">0</strong></span>
    </div>

    <div id="word" class="word" aria-label="Hidden word"></div>

    <div id="keyboard" class="keyboard" aria-label="Letter keyboard"></div>

    <p id="message" class="message" aria-live="polite">Choose a letter.</p>
    <p id="guessed" class="guessed">Guessed letters: none</p>

    <button id="resetButton" class="reset-button">New Game</button>
  </main>

  <script src="hangman.js"></script>
</body>

</html>
